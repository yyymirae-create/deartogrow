*{box-sizing:border-box}body{margin:0;background:#333b30;color:#fff;font-family:Dotum,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #fff;outline-offset:8px}
.cover{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.photos,.shade{position:absolute;inset:0;z-index:-2}.photo{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 55%;opacity:0;transition:opacity 1.2s ease}.photo.active{opacity:1}.shade{z-index:-1;background:linear-gradient(180deg,rgba(20,29,21,.32),rgba(20,29,21,.18) 30%,rgba(20,29,21,.65) 100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:30px 5vw}.brand{display:flex;align-items:flex-end;gap:6px;font-family:Dunggeunmiso,Dotum,sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em;flex-shrink:0;color:#3F5346}.brand-mark{position:relative;display:block;width:60px;height:66px;overflow:hidden;flex-shrink:0}.brand img{position:absolute;width:96px;height:96px;max-width:none;left:-18px;top:-15px}.brand-name{line-height:1;padding-bottom:2px}nav{display:flex;gap:30px;font-size:15px}nav a{padding:8px 0;border-bottom:1px solid transparent}nav a:hover{border-color:currentColor}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:90px 24px 110px;text-shadow:0 2px 22px #17211966}.eyebrow{font-size:13px;letter-spacing:.3em;margin:0 0 26px}h1{font-family:Batang,serif;font-size:clamp(32px,4.5vw,64px);font-weight:400;line-height:1.65;letter-spacing:-.045em;margin:0;word-break:keep-all}.more{display:inline-flex;align-items:center;gap:36px;border-bottom:1px solid #ffffffbb;padding:15px 2px;margin-top:42px;font-size:15px;letter-spacing:.13em}.more svg{width:28px;height:18px;transition:transform .2s}.more:hover svg{transform:translateX(6px)}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 5vw 28px;gap:20px;font-size:12px;letter-spacing:.05em;color:#ffffffe0}.dots{display:flex;gap:7px}.dots span{width:18px;height:2px;background:#ffffff50}.dots span.active{background:#fff}
@media(max-width:600px){header{padding:8px 16px 8px 4px;align-items:center;gap:12px}.brand{font-size:24px;gap:5px}.brand-mark{width:45px;height:50px}.brand img{width:72px;height:72px;left:-13px;top:-11px}nav{gap:15px;font-size:13px}nav .desktop{display:none}main{padding:70px 20px 90px}h1{font-size:clamp(29px,7.8vw,42px)}.eyebrow{font-size:11px;letter-spacing:.23em}.more{margin-top:32px}footer{padding:0 24px 24px;font-size:10px}.photo{object-position:50% 50%}}

</main>
<footer><span>아동·청소년 상담 · 양육상담 · 심리검사</span><div class="dots" aria-hidden="true"><span class="active"></span><span></span><span></span></div></footer>
</div>
<script>
// Preserve previously shared links to sections of the detailed homepage.
const sections=['hero','about','signs','programs','process','pricing','counselor','space-gallery','contact'];
function openSection(){if(sections.includes(location.hash.slice(1))) location.replace('home.html'+location.hash);}
window.addEventListener('hashchange',openSection);openSection();
const photos=[...document.querySelectorAll('.photo')];
const dots=[...document.querySelectorAll('.dots span')];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let current=0,timer;
function start(){clearInterval(timer);if(motion.matches||document.hidden)return;timer=setInterval(()=>{const next=(current+1)%photos.length;if(!photos[next].complete||!photos[next].naturalWidth)return;photos[current].classList.remove('active');dots[current].classList.remove('active');current=next;photos[current].classList.add('active');dots[current].classList.add('active');},3000)}
motion.addEventListener('change',start);document.addEventListener('visibilitychange',start);start();
</script>
</body>
